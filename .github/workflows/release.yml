# Builds, signs, notarizes and publishes BisprBlow when a v* tag is pushed.
# Installed apps find the new version through appcast.xml on the latest release (Sparkle).
#
# Secrets (see RELEASING.md):
#   DEVID_P12_BASE64, DEVID_P12_PASSWORD      Developer ID Application certificate and key
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   notarytool login (app-specific password)
#   SPARKLE_ED_PRIVATE_KEY                    EdDSA key that signs the update feed
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Add required reviewers to this environment in the repo settings to gate each release.
    environment: release
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh reads the version from the newest tag and the build number from the commit count.
          fetch-depth: 0

      # The models are about 1 GB and do not change between releases.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Application Support/BisprBlow/models
            ~/Library/Application Support/FluidAudio/Models
          key: models-v1

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import signing identity and notary login
        env:
          DEVID_P12_BASE64: ${{ secrets.DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/release.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$DEVID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          # codesign needs the intermediate certificate to build the chain, and the runner may not have it.
          curl -fsSLo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          # build.sh and dmg.sh find the identity and the notary profile through the default search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          xcrun notarytool store-credentials bisprblow --keychain "$KC" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          chmod 600 "$RUNNER_TEMP/sparkle.key"
          security find-identity -v -p codesigning "$KC"

      - name: Build, sign and notarize
        env:
          NO_INSTALL: "1"
          REQUIRE_NOTARIZE: "1"
        run: |
          set -euo pipefail
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key" ./dmg.sh
          xcrun stapler validate .build/BisprBlow.dmg
          # The tag must match the version stamped into the app, or Sparkle offers the wrong build.
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" .build/BisprBlow.app/Contents/Info.plist)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "App says $V, tag is $GITHUB_REF_NAME" >&2; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .build/BisprBlow.dmg .build/appcast.xml --clobber
          else
            gh release create "$GITHUB_REF_NAME" .build/BisprBlow.dmg .build/appcast.xml \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Remove keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/devid.p12"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
